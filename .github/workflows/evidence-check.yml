name: Evidence Check
on:
  push:
    branches: [main]
    paths: ['tools/**', 'practice/**', 'docs/**', '*.md', 'LICENSE', 'release.json', 'package*.json', 'third_party/**', '.github/workflows/evidence-check.yml']
  pull_request:
    paths: ['tools/**', 'practice/**', 'docs/**', '*.md', 'LICENSE', 'release.json', 'package*.json', 'third_party/**', '.github/workflows/evidence-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node tools/check-third-party.mjs
      - run: node tools/sync-legal-notices.mjs --check
      - run: node --test tools/tests/*.test.mjs
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - run: python3 tools/release.py build --output dist
      - run: python3 tools/release.py verify --archive dist/arctic-console-0.2.0.zip
      - name: Prepare public files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tools/release.py site --output dist/site
      # actions/upload-pages-artifact v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/site
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: evidence-check-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
