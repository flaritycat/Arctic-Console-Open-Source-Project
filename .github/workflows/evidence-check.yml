name: Evidence Check
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/evidence-check.yml']
  pull_request:
    paths: ['tools/**', '.github/workflows/evidence-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test tools/tests/evidence-check.test.mjs
